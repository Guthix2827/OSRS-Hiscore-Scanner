services:
  scanner:
    build: .
    container_name: osrs-hiscore-scanner
    environment:
      CONCURRENCY: "1"
      REQUEST_DELAY_MS: "4000"
      TIMEOUT_MS: "30000"
      MAX_RETRIES: "5"
      NAME_LENGTH: "3"
      OUTPUT_DIR: "/app/output"
    volumes:
      - ./output:/app/output
    restart: "no"
