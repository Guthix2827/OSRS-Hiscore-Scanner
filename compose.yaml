services:
  scanner:
    build: .
    container_name: osrs-hiscore-scanner
    environment:
      CONCURRENCY: "4"
      TIMEOUT_MS: "15000"
      REQUEST_DELAY_MS: "250"
      MAX_RETRIES: "3"
      NAME_LENGTH: "3"
      OUTPUT_DIR: "/app/output"
    volumes:
      - ./output:/app/output
    restart: "no"
